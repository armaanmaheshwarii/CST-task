<!DOCTYPE html>
<html>
<head>
    <title>Interactive Restaurant Menu</title>
</head>

<body bgcolor="lightyellow">

    <h1 align="center">Interactive Restaurant Menu</h1>

    <h3 align="center">Click on the food items to know more!</h3>

    <center>
        <img src="https://images.unsplash.com/photo-1546549032-9571cd6b27df?w=800"
             alt="Restaurant Food"
             usemap="#foodmap"
             width="800"
             height="533">
    </center>

    <map name="foodmap">

        <!-- Circle 1: Pizza -->
        <area shape="circle"
              coords="200,150,70"
              href="https://www.youtube.com/watch?v=eIWhfEhek60"
              alt="Pizza"
              target="_blank">

        <!-- Circle 2: Burger -->
        <area shape="circle"
              coords="550,150,60"
              href="https://www.hotstar.com/in/onboarding/profile?ref=%2Fin"
              alt="Burger"
              target="_blank">

        <!-- Rectangle 1: Sandwich -->
        <area shape="rect"
              coords="50,250,300,380"
              href="https://en.wikipedia.org/wiki/Sandwich"
              alt="Sandwich"
              target="_blank">

        <!-- Rectangle 2: French Fries -->
        <area shape="rect"
              coords="400,250,700,380"
              href="https://www.netflix.com/browse"
              alt="French Fries"
              target="_blank">

        <!-- Polygon 1: Cake -->
        <area shape="poly"
              coords="100,400,180,390,250,450,170,480"
              href="https://www.google.com/?client=safari&channel=ipad_bm"
              alt="Cake"
              target="_blank">

        <!-- Polygon 2: Ice Cream -->
        <area shape="poly"
              coords="450,400,520,400,550,460,500,490,460,460"
              href="https://www.apple.com/in/"
              alt="Ice Cream"
              target="_blank">

        <!-- Default Area -->
        <area shape="default"
              href="https://www.apple.com/in/"
              alt="Other Food Information"
              target="_blank">

    </map>

    <h2 align="center">Our Menu</h2>

    <center>
        <p>Pizza | Burger | Sandwich</p>
        <p>French Fries | Cake | Ice Cream</p>
    </center>

    <h3 align="center">Thank You for Visiting!</h3>

</body>
</html>
