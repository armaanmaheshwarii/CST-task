<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

<h2>Online Course Registration Form</h2>

<form>

    <label>Student Name:</label>
    <input type="text" name="name" required minlength="3">
    <br><br>

    <label>Email Address:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Mobile Number:</label>
    <input type="tel" name="mobile" required minlength="10" maxlength="10">
    <br><br>

    <label>Select Course:</label>
    <select name="course" required>
        <option value="">--Select Course--</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
    </select>
    <br><br>

    <textarea></textarea>

    <!-- Task 6: Course Dropdown -->
    <label for="course">Course:</label>
    <select id="course" name="course" required>
        <option value="">Select a Course</option>
        <option value="Web Development">Web Development</option>
        <option value="Python Programming">Python Programming</option>
        <option value="Data Analytics">Data Analytics</option>
        <option value="Digital Marketing">Digital Marketing</option>
    </select>
    <br><br>

    <!-- Task 7: Hidden Input -->
    <input type="hidden" name="registration"
           value="Online Course Registration">

     <!-- Task 8: Date of Birth and Class Time -->
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">
    <br><br>

    <label for="classTime">Preferred Class Time:</label>
    <input type="time" id="classTime" name="classTime">
    <br><br>

    <!-- Task 9: Address / Additional Information -->
    <label for="address">Address / Additional Information:</label>
    <br>
    <textarea id="address" name="address"
              rows="5" cols="40"
              placeholder="Enter your address or additional information"></textarea>
    <br><br>      
    
     <!-- Task 10: File Upload -->
    <label for="document">Upload Document/Photograph:</label>
    <input type="file" id="document" name="document">
    <br><br>

    <!-- Task 11: Required Fields -->

    <label for="name">Student Name:</label>
    <input type="text" id="name" name="name"
           placeholder="Enter your name" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your email" required>
    <br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile"
           placeholder="Enter mobile number" required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password"
           placeholder="Enter password" required>
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male" required> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <!-- Hidden field -->
    <input type="hidden" name="form_type" value="Online Course Registration">

    <!-- Submit and Reset -->
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

    <button type="submit">Submit</button>

</form>

</body>
</html>
